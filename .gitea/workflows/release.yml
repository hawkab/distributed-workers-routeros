name: Component release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or resume
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: fleet-ci
    env:
      FLEET_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_API_URL: ${{ github.api_url }}
      GITEA_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out the exact public version tag
        env:
          GITEA_WEB_URL: ${{ github.server_url }}
        run: |
          set -eu
          python3 -B - <<'PY_CHECKOUT'
          import os, re, subprocess, urllib.parse
          base = os.environ["GITEA_WEB_URL"].rstrip("/")
          repo = os.environ["GITEA_REPOSITORY"]
          tag = os.environ["FLEET_RELEASE_TAG"]
          parsed = urllib.parse.urlsplit(base)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.query or parsed.fragment:
              raise SystemExit("Invalid public Gitea URL")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", repo):
              raise SystemExit("Invalid repository name")
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", tag):
              raise SystemExit("An existing version tag is required")
          # Preserve the complete server path, including a /git installation.
          remote = base + "/" + repo + ".git"
          def git(*args):
              subprocess.run(["git", *args], check=True)
          git("init", "-q")
          present = subprocess.run(["git", "remote", "get-url", "origin"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
          git("remote", "set-url" if present else "add", "origin", remote)
          git("-c", "credential.helper=", "fetch", "--quiet", "--no-recurse-submodules", "--no-tags", "origin", "refs/tags/" + tag + ":refs/tags/" + tag)
          git("checkout", "--quiet", "--detach", tag)
          PY_CHECKOUT

      - name: Publisher regression tests
        run: python3 -m unittest discover -s ci/tests -v
      - name: Verify canonical artifacts and publish this mirror
        run: python3 -B ci/router_release.py release --provider gitea
